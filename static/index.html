<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Caring Contact Resource Finder</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Montserrat:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --ground:#FFFFFF; --surface:#FFFFFF; --sunk:#F2F3F2; --ink:#1D1D1B; --text:#2B2B29; --muted:#5E625F; --line:#DCDFDC;
  --navy:#00857B; --navy-ink:#FFFFFF; --lime:#FFFFFF; --lime-strong:#F3F4F2; --teal:#00A396; --sky:#E7F5F3; --bright:#1BA3DC;
  --leaf:#8DBF45; --lime-pop:#C9DA2A; --pill:#EDEEED;
  --accent:#00857B; --accent-ink:#FFFFFF; --accent-soft:#E7F5F3;
  --crit:#A3281A; --crit-soft:#FDECE8; --warn:#8A5A00; --warn-soft:#FBF1DC;
  --sugg:#8A1E6A; --sugg-soft:#F8E8F2; --ok:#00766D; --ok-soft:#E1F3F0;
  --display:"Libre Baskerville",Georgia,"Times New Roman",serif; --body:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark; --ground:#161817; --surface:#1E2120; --sunk:#262A28; --ink:#F1F2F0; --text:#E4E6E3; --muted:#A6ABA7; --line:#343936;
  --navy:#2BC2B3; --navy-ink:#07201D; --lime:#161817; --lime-strong:#232725; --teal:#35C9BA; --sky:#15302C; --bright:#5DBFEA;
  --leaf:#A6D26A; --lime-pop:#D6E55A; --pill:#2C302E;
  --accent:#4DD0C2; --accent-ink:#07201D; --accent-soft:#15302C; --crit:#F29A88; --crit-soft:#3A1D17; --warn:#F0C06A; --warn-soft:#352812;
  --sugg:#E79ACB; --sugg-soft:#3A1830; --ok:#6FDCCB; --ok-soft:#123530;}}
:root[data-theme="dark"]{
  color-scheme:dark; --ground:#161817; --surface:#1E2120; --sunk:#262A28; --ink:#F1F2F0; --text:#E4E6E3; --muted:#A6ABA7; --line:#343936;
  --navy:#2BC2B3; --navy-ink:#07201D; --lime:#161817; --lime-strong:#232725; --teal:#35C9BA; --sky:#15302C; --bright:#5DBFEA;
  --leaf:#A6D26A; --lime-pop:#D6E55A; --pill:#2C302E;
  --accent:#4DD0C2; --accent-ink:#07201D; --accent-soft:#15302C; --crit:#F29A88; --crit-soft:#3A1D17; --warn:#F0C06A; --warn-soft:#352812;
  --sugg:#E79ACB; --sugg-soft:#3A1830; --ok:#6FDCCB; --ok-soft:#123530;}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
img{max-width:100%}
body{background:var(--ground);color:var(--text);font:16px/1.5 var(--body);padding-inline:0;padding-block:0 48px}
.wrap,.band>div{padding-inline:16px}
h1,h2,h3{color:var(--ink)}
.wrap{max-width:1180px;margin:0 auto}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.muted{color:var(--muted)}

.band{background:var(--lime);border-bottom:1px solid var(--line)}
.band>div{max-width:1180px;margin:0 auto}
header.top{padding-block:22px 22px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between}
.brand{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.logo{line-height:1.05}
.logo small{display:block;font:700 12px var(--body);color:var(--teal);letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.logo h1{font-size:clamp(26px,4vw,36px);font-weight:700}
.brand p{margin:0;color:var(--muted);max-width:40ch;font-weight:500;font-size:15px;padding-left:16px;border-left:3px solid var(--leaf)}
.mode{display:flex;gap:6px}
.right{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.signout{margin:0}
.signout button{border:0;background:none;color:var(--muted);text-decoration:underline;font:500 14px var(--body);padding:4px}
.mode button{border:0;background:var(--pill);padding:9px 20px;border-radius:999px;font:600 14px var(--body);color:var(--ink)}
.mode button[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink)}
.hero{padding-block:26px 6px;text-align:center}
.hero h2{font-size:clamp(24px,3.4vw,34px);font-weight:700}
.hero p{margin:6px auto 0;color:var(--muted);max-width:60ch}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-block:18px 26px}
.topics button{border:0;background:var(--lime-strong);color:var(--ink);border-radius:4px;padding:18px 16px 16px;min-height:96px;font:700 16px/1.3 var(--display);text-align:center;display:grid;gap:6px;place-items:center;align-content:center}
.topics button::after{content:"";width:44px;height:2px;background:var(--leaf);order:3}
.topics button span{font:500 13px var(--body);color:var(--muted);order:2}
.topics button:hover{filter:brightness(.96)}
.topics button.crit{background:var(--navy);color:var(--navy-ink)}
.topics button.crit span{color:var(--navy-ink);opacity:.85}
.topics button.crit::after{background:var(--lime-pop)}
.searchbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ground);padding-block:10px 12px;border-bottom:1px solid var(--line)}
.searchbox{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 18px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.searchbox:focus-within{box-shadow:0 0 0 3px color-mix(in srgb,var(--teal) 45%,transparent)}
.searchbox svg{flex:none;color:var(--muted)}
#q{flex:1;min-width:0;border:0;background:transparent;font-size:19px;padding:10px 0;outline:none}
.clear{border:0;background:var(--pill);border-radius:999px;padding:6px 12px;color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.filters select{background:var(--pill);border:0;border-radius:999px;font-weight:600;font-size:14px;padding:7px 10px;max-width:100%}
.toggle{display:inline-flex;gap:6px;align-items:center;background:var(--pill);border:0;border-radius:999px;font-weight:600;padding:6px 10px;font-size:14px}
.toggle input{accent-color:var(--accent);width:16px;height:16px;margin:0}
.count{margin-left:auto;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}

.notices{display:grid;gap:8px;margin-block:4px 16px}
.notice{border-radius:12px;padding:12px 14px;display:grid;gap:2px;border:1px solid transparent}
.notice.critical{background:var(--crit-soft);border-color:color-mix(in srgb,var(--crit) 35%,transparent)}
.notice.critical strong{color:var(--crit)}
.notice.info{background:var(--sky);border-color:transparent}
.notice strong{font-family:var(--display);font-size:15px}
.notice.info{border-left:3px solid var(--teal)}
.notice p{margin:0;font-size:15px}

.layout{display:grid;grid-template-columns:250px 1fr;gap:24px;align-items:start}
nav.cats{position:sticky;top:140px;display:grid;gap:2px;max-height:calc(100vh - 170px);overflow:auto;padding-right:4px}
nav.cats button{display:flex;justify-content:space-between;gap:8px;text-align:left;border:0;background:transparent;border-radius:8px;padding:7px 10px;font-size:14px;color:var(--ink)}
nav.cats button:hover{background:var(--sunk)}
nav.cats button[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink);font-weight:700}
nav.cats .n{font-variant-numeric:tabular-nums;opacity:.7}
.catselect{display:none}
@media (max-width:820px){.layout{grid-template-columns:1fr}nav.cats{display:none}.catselect{display:block}}

.group{margin-bottom:28px}
.group>h2{font-size:22px;font-weight:700;padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:4px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.group>p.gdesc{margin:0 0 10px;color:var(--muted);font-size:14px}
.cards{display:grid;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 1px 0 var(--line);padding:14px 16px;display:grid;gap:8px}
.card.sugg{border-style:dashed;border-color:var(--sugg)}
.card{border-top:3px solid var(--teal)}
.card.sugg{border-top-style:dashed}
.card h3{font-size:18px;font-weight:700;line-height:1.35}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.b{font-size:12px;font-weight:700;letter-spacing:.02em;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.b.h24{background:var(--ok-soft);color:var(--ok)}
.b.ref{background:var(--crit-soft);color:var(--crit)}
.b.sg{background:var(--sugg-soft);color:var(--sugg)}
.b.out{background:var(--warn-soft);color:var(--warn)}
.b.hid{background:var(--ink);color:var(--ground)}
.card p.desc{margin:0;max-width:75ch}
.contacts{display:flex;flex-wrap:wrap;gap:8px}
.num{display:inline-flex;align-items:center;gap:8px;background:var(--sky);border-radius:999px;padding:5px 6px 5px 14px}
.num .lbl{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.num .v{font-family:var(--mono);font-size:16px;font-variant-numeric:tabular-nums;user-select:all}
.num button{border:0;background:var(--navy);border-radius:999px;padding:4px 12px;font-size:12px;color:var(--navy-ink);font-weight:600}
.meta{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:14px;margin:0}
.meta dt{color:var(--muted)}
.meta dd{margin:0;overflow-wrap:anywhere}
.warnline{font-size:14px;background:var(--warn-soft);color:var(--ink);border-radius:8px;padding:6px 10px;margin:0}
.card.sugg .warnline{background:var(--sugg-soft)}
.src{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.editlink{border:0;background:none;color:var(--accent);font-weight:700;font-size:13px;padding:0}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:24px;text-align:center;color:var(--muted)}
mark{background:color-mix(in srgb,var(--warn) 25%,transparent);color:inherit;border-radius:3px}

/* admin */
.admin{display:grid;gap:16px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:0;background:var(--pill);border-radius:999px;padding:8px 16px;font-weight:600;font-size:14px}
.tabs button[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.adminlist{display:grid;gap:4px;max-height:560px;overflow:auto}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:8px;border:1px solid transparent}
.row:hover{background:var(--sunk)}
.row .t{min-width:0;overflow-wrap:anywhere}
.row .t small{display:block;color:var(--muted)}
.btn{border:0;background:var(--pill);border-radius:999px;padding:9px 18px;font-weight:600;font-size:14px}
.btn.primary{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.btn.danger{color:var(--crit);background:var(--crit-soft)}
.btn.small{padding:4px 10px;font-size:13px}
.adminbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.adminbar input{flex:1;min-width:180px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface)}
form.edit{display:grid;gap:12px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
label.f{display:grid;gap:4px;font-size:14px;font-weight:700}
label.f span.hint{font-weight:400;color:var(--muted);font-size:13px}
label.f input,label.f textarea,label.f select{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--ground);font-weight:400;width:100%}
label.f textarea{min-height:90px;resize:vertical}
fieldset{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0;display:grid;gap:8px}
legend{font-weight:700;font-size:14px;padding:0 4px}
.pair{display:grid;grid-template-columns:1fr 1.4fr auto;gap:6px}
.pair input{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--ground);min-width:0}
.checks{display:flex;flex-wrap:wrap;gap:8px 16px}
.checks label{display:inline-flex;gap:6px;align-items:center;font-size:14px}
.checks input{accent-color:var(--accent)}
.status{font-size:14px;min-height:1.5em}
.status.err{color:var(--crit)}
.status.good{color:var(--ok)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--crit-soft);border-radius:10px;padding:8px 12px}
.adminhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.loading{padding:40px 0;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}
</style>
</head>
<body>

<div class="band"><div>
  <header class="top">
    <div class="brand">
      <div class="logo"><small>Caring Contact · NJ</small><h1 id="siteTitle">Resource Finder</h1></div>
      <p id="siteSub">New Jersey mental health and support resources for Caring Contact volunteers</p>
    </div>
    <div class="right">
    <div class="mode" id="modeSwitch" hidden>
      <button type="button" id="modeFind" aria-pressed="true">Find resources</button>
      <button type="button" id="modeAdmin" aria-pressed="false">Manage</button>
    </div>
    <form method="post" action="/logout" class="signout"><button type="submit">Sign out</button></form>
    </div>
  </header>
</div></div>
<div class="wrap">
<main id="findView">
    <div class="searchbar">
      <div class="searchbox">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" autocomplete="off" placeholder="Try: grief, Bergen, teen, 24/7, housing, veteran, eating…" aria-label="Search resources">
        <button type="button" class="clear" id="clearQ" hidden>Clear</button>
      </div>
      <div class="filters">
        <select id="catSel" class="catselect" aria-label="Category"></select>
        <select id="countySel" aria-label="County"></select>
        <select id="ageSel" aria-label="Age"><option value="">Any age</option><option value="youth">Youth (under 18)</option><option value="adult">Adult (18+)</option></select>
        <label class="toggle"><input type="checkbox" id="only247"> Open 24/7</label>
        <label class="toggle"><input type="checkbox" id="showSugg" checked> Show suggestions</label>
        <span class="count" id="count"></span>
      </div>
    </div>
    <section class="notices" id="notices" aria-label="Important rules"></section>
    <section id="home" aria-label="Browse by topic"><div class="hero"><h2>What does the caller need help with?</h2><p>Search above, or pick a topic. Filter by county, age and 24/7 to narrow the list.</p></div><div class="topics" id="topics"></div></section>
    <div class="layout">
      <nav class="cats" id="cats" aria-label="Categories"></nav>
      <div id="results"><p class="loading">Loading resources…</p></div>
    </div>
  </main>

  <main id="adminView" hidden></main>
</div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const h = (tag, attrs, ...kids) => {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    return el;
  };
  const store = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } };

  const S = { resources: [], categories: [], notices: [], available: [], site: null, loaded: new Set(), cat: "all", admin: false, tab: "resources", editing: null };
  let db = null;

  // ---------- data ----------
  const byOrder = (a, b) => (a.order ?? 0) - (b.order ?? 0) || String(a.name || a.title || "").localeCompare(String(b.name || b.title || ""));
  const catMap = () => Object.fromEntries(S.categories.map(c => [c.id, c]));
  const counties = () => (S.site?.counties?.length ? S.site.counties : []);

  function subscribe(name, key) {
    db.collection(name).onSnapshot(snap => {
      const rows = snap.docs.filter(d => d.exists).map(d => ({ id: d.id, ...d.data() }));
      if (key === "site") S.site = rows.find(r => r.id === "site") || null; else S[key] = rows.sort(byOrder);
      S.loaded.add(key);
      renderAll();
    }, err => { $("#results").replaceChildren(h("div", { class: "empty" }, "The resource list could not load (" + err.code + "). Try reloading the page.")); });
  }

  // ---------- search ----------
  const norm = s => String(s || "").toLowerCase().replace(/[’']/g, "'");
  const digits = s => String(s || "").replace(/\D/g, "");
  function haystack(r) {
    const cm = catMap();
    return norm([r.name, r.description, r.notes, r.hours, r.ages, r.cost, r.address, r.website, (r.tags || []).join(" "),
      (r.counties || []).join(" ") + " county", (r.categories || []).map(c => cm[c]?.name).join(" "),
      (r.phones || []).map(p => p.label + " " + p.number).join(" "), (r.texts || []).map(t => t.label + " " + t.value).join(" "),
      r.is247 ? "24/7 24 hour 24-hour anytime overnight" : "", r.suggestion ? "suggestion suggested" : "",
      r.goesToCaller ? "outreach goes to caller mobile" : ""].join(" "));
  }
  function score(r, terms) {
    if (!terms.length) return 1;
    const hay = haystack(r), name = norm(r.name), dig = digits((r.phones || []).map(p => p.number).join(" "));
    let s = 0;
    for (const t of terms) {
      const td = digits(t);
      if (td.length >= 3 && dig.includes(td)) { s += 5; continue; }
      const county = counties().find(c => c.toLowerCase() === t);
      if (county) { if ((r.counties || []).some(c => c === county || c === "Statewide" || c === "National")) { s += 1; continue; } return 0; }
      if (!hay.includes(t)) return 0;
      s += name.includes(t) ? 4 : 1;
    }
    return s;
  }
  // Inclusive on purpose: a service is only hidden when its ages clearly exclude the group.
  function ageFits(r, age) {
    const a = String(r.ages || "").trim();
    if (!a) return true;
    return age === "youth" ? !/^(18|21)\+|older/i.test(a) : !/under 18|^youth$/i.test(a);
  }
  function filtered() {
    const q = norm($("#q").value).trim();
    const terms = q.split(/\s+/).filter(Boolean);
    const age = $("#ageSel").value, county = $("#countySel").value, only247 = $("#only247").checked, sugg = $("#showSugg").checked;
    return S.resources.filter(r => !r.hidden || S.admin)
      .filter(r => S.cat === "all" || (r.categories || []).includes(S.cat))
      .filter(r => !county || (r.counties || []).some(c => c === county || c === "Statewide" || c === "National"))
      .filter(r => !only247 || r.is247)
      .filter(r => !age || ageFits(r, age))
      .filter(r => sugg || !r.suggestion)
      .map(r => ({ r, s: score(r, terms) })).filter(x => x.s > 0);
  }

  // ---------- volunteer view ----------
  function renderNotices() {
    $("#notices").replaceChildren(...S.notices.filter(n => !n.hidden).map(n =>
      h("div", { class: "notice " + (n.level === "critical" ? "critical" : "info") }, h("strong", {}, n.title), h("p", {}, n.body))));
  }
  function renderFilters() {
    const cs = $("#countySel"), cur = cs.value;
    cs.replaceChildren(h("option", { value: "" }, "All counties"), ...counties().map(c => h("option", { value: c }, c + " County")));
    cs.value = cur;
    const visible = S.resources.filter(r => !r.hidden || S.admin);
    const cnt = id => visible.filter(r => id === "all" || (r.categories || []).includes(id)).length;
    const opts = [{ id: "all", name: "All resources" }, ...S.categories];
    $("#cats").replaceChildren(...opts.map(c => h("button", { type: "button", "aria-pressed": String(S.cat === c.id), onclick: () => { S.cat = c.id; renderAll(); } },
      h("span", {}, c.name), h("span", { class: "n" }, cnt(c.id)))));
    const sel = $("#catSel");
    sel.replaceChildren(...opts.map(c => h("option", { value: c.id }, c.name + " (" + cnt(c.id) + ")")));
    sel.value = S.cat;
  }
  function highlight(text, terms) {
    text = String(text || "");
    const ts = terms.filter(t => t.length > 1 && !/^\d+$/.test(t)).map(t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
    if (!ts.length) return [text];
    const re = new RegExp("(" + ts.join("|") + ")", "ig");
    return text.split(re).map((p, i) => i % 2 ? h("mark", {}, p) : p);
  }
  function copyBtn(value) {
    const b = h("button", { type: "button", "aria-label": "Copy " + value }, "Copy");
    b.addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(value); b.textContent = "Copied"; }

  $("#clearQ").addEventListener("click", () => { $("#q").value = ""; renderResults(); $("#q").focus(); });
  $("#catSel").addEventListener("change", e => { S.cat = e.target.value; renderAll(); });
  for (const id of ["#countySel", "#ageSel", "#only247", "#showSugg"]) $(id).addEventListener("change", () => { store("f" + id, $(id).type === "checkbox" ? $(id).checked : $(id).value); renderResults(); });
  $("#modeFind").addEventListener("click", () => setMode("find"));
  $("#modeAdmin").addEventListener("click", () => setMode("admin"));
  const sc = store("f#showSugg"); if (sc != null) $("#showSugg").checked = sc === "true";
  const s24 = store("f#only247"); if (s24 != null) $("#only247").checked = s24 === "true";

  // ---------- server connection ----------
  // Mirrors the small slice of a realtime document store the page was written against:
  // collection(name).onSnapshot(cb) and collection(name).doc(id).set()/delete().
  function makeDb() {
    const subs = {}, errs = [];
    let timer = null;
    async function refresh() {
      let res;
      try { res = await fetch("/api/data", { headers: { "X-Requested-With": "fetch" } }); }
      catch (e) { return; }
      if (res.status === 401) { location.href = "/login"; return; }
      if (!res.ok) { errs.forEach(f => f({ code: "unavailable" })); return; }
      const data = await res.json();
      for (const [c, cbs] of Object.entries(subs)) {
        const docs = (data[c] || []).map(x => ({ id: x.id, exists: true, data: () => x.data }));
        cbs.forEach(cb => cb({ docs }));
      }
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(refresh, 0); }
    setInterval(() => { if (!document.hidden) refresh(); }, 60000);
    async function write(method, c, id, data) {
      const res = await fetch("/api/" + c + "/" + encodeURIComponent(id), {
        method, headers: { "Content-Type": "application/json", "X-Requested-With": "fetch" }, body: data ? JSON.stringify(data) : undefined });
      if (res.status === 401) { location.href = "/login"; return; }
      if (!res.ok) throw { code: res.status === 403 ? "invalid_argument" : "unavailable" };
      await refresh();
    }
    return {
      collection: c => ({
        onSnapshot(cb, err) { (subs[c] = subs[c] || []).push(cb); if (err) errs.push(err); schedule(); return () => {}; },
        doc: id => ({ set: data => write("PUT", c, id, data), delete: () => write("DELETE", c, id) }),
      }),
    };
  }

  // ---------- boot ----------
  (async () => {
    db = makeDb();
    subscribe("resources", "resources"); subscribe("categories", "categories"); subscribe("notices", "notices"); subscribe("settings", "site");
    let me = {};
    try { me = await (await fetch("/api/me")).json(); } catch (e) {}
    if (me.role === "admin") { S.admin = true; subscribe("available", "available"); $("#modeSwitch").hidden = false; renderAll(); }
  })();
})();
</script>
